<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="interactive-widget" content="resizes-content" />
    <meta name="theme-color" content="#f4f5fa" />
    <title>WalkDate</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body>
    <div id="app" class="app">
      <nav class="tabs" aria-label="Разделы">
        <button class="tab" data-tab="home" type="button" aria-label="Сообщения">
          <span class="tab-ico" aria-hidden="true">💬</span>
        </button>
        <button class="tab" data-tab="dating" type="button" aria-label="Знакомства">
          <span class="tab-ico" aria-hidden="true">💞</span>
        </button>
        <button class="tab active" data-tab="stats" type="button" aria-label="Профиль">
          <span class="tab-ico" aria-hidden="true">👤</span>
        </button>
      </nav>

      <main class="main">
        <section class="view hidden" id="view-home"></section>
        <!-- <section class="view hidden" id="view-events"></section> -->
        <section class="view hidden" id="view-dating"></section>
        <section class="view" id="view-stats"></section>
        <!-- <section class="view hidden" id="view-circle"></section> -->
      </main>
    </div>

    <dialog id="dlgQuestionnaire" class="dialog">
      <div class="dialog-card questionnaire-dialog">
        <div class="dialog-head" style="justify-content:center">
          <div>
            <div class="dialog-title">Анкета совместимости</div>
            <div class="muted" id="qnBlock"></div>
          </div>
        </div>
        <div class="qn-progress" aria-hidden="true"><div id="qnProgressBar" class="qn-progress-bar"></div></div>
        <div class="qn-counter muted" id="qnCounter"></div>
        <div class="qn-stage">
          <div id="qnCard" class="qn-card"></div>
        </div>
        <div style="margin-top:12px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap">
          <button class="btn ghost" id="btnQuestionnaireBack" type="button">← Назад</button>
          <button class="btn" id="btnQuestionnaireNext" type="button">Далее →</button>
          <button class="btn ghost" id="btnQuestionnaireClose" type="button">Закрыть</button>
        </div>
      </div>
    </dialog>

    <dialog id="dlgOnboarding" class="dialog">
      <div class="dialog-card questionnaire-dialog">
        <div class="dialog-head" style="justify-content:center">
          <div class="dialog-title">Давай знакомиться!</div>
        </div>
        <div id="onboardingStep1">
          <div class="muted" style="text-align:center;margin-bottom:16px">Кого вы ищете?</div>
          <div style="display:flex;gap:12px;justify-content:center">
            <button class="btn" id="obGenderMale" type="button" style="flex:1;max-width:180px">Мужчина ищу женщину</button>
            <button class="btn" id="obGenderFemale" type="button" style="flex:1;max-width:180px">Женщина ищу мужчину</button>
          </div>
        </div>
        <div id="onboardingStep2" hidden>
          <div class="muted" style="text-align:center;margin-bottom:16px">Как вас зовут?</div>
          <div style="max-width:320px;margin:0 auto">
            <input id="obNameInput" class="input" type="text" maxlength="40" placeholder="Ваше имя" style="width:100%;max-width:320px" autocomplete="name" />
          </div>
          <div style="text-align:center;margin-top:16px">
            <button class="btn" id="obNameSubmit" type="button" disabled>Далее →</button>
          </div>
        </div>
        <div id="onboardingStep3" hidden>
          <div style="text-align:center">
            <div style="font-size:48px;margin-bottom:12px">👋</div>
            <div style="font-weight:700;font-size:18px;margin-bottom:8px" id="obGreeting"></div>
            <div class="muted" style="margin-bottom:20px">Хотите зарегистрироваться, чтобы сохранить анкету и найти пару?</div>
            <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
              <button class="btn" id="obRegister" type="button">Зарегистрироваться</button>
              <button class="btn ghost" id="obSkip" type="button">Пока нет</button>
            </div>
          </div>
        </div>
      </div>
    </dialog>

    <dialog id="dlgRegister" class="dialog">
      <div class="dialog-card questionnaire-dialog">
        <div class="dialog-head" style="justify-content:center">
          <div class="dialog-title">Регистрация</div>
        </div>
        <form class="auth-form" id="regForm" autocomplete="on">
          <div class="row" style="margin-top:10px">
            <label class="label" for="regEmail">Email</label>
            <input id="regEmail" name="email" class="input" type="email" inputmode="email" autocomplete="email" required placeholder="name@example.com" style="width:100%;max-width:360px" />
          </div>
          <div class="row">
            <label class="label" for="regPassword">Пароль</label>
            <input id="regPassword" name="password" class="input" type="password" autocomplete="new-password" placeholder="минимум 6 символов" style="width:100%;max-width:360px" />
          </div>
          <div class="row-inline">
            <button id="btnRegSubmit" class="btn" type="submit">Зарегистрироваться</button>
          </div>
          <div class="row-inline" style="margin-top:8px; justify-content:center; gap:12px">
            <button id="btnRegLogin" class="link-btn" type="button">Уже есть аккаунт? Войти</button>
          </div>
        </form>
        <div style="text-align:center;margin-top:12px">
          <button class="btn ghost" id="btnRegClose" type="button">Пока нет</button>
        </div>
      </div>
    </dialog>

    <dialog id="dlgSubscription" class="dialog">
      <div class="dialog-card questionnaire-dialog">
        <div class="dialog-head" style="justify-content:space-between">
          <div class="dialog-title">Подписка</div>
          <button class="btn ghost" id="btnSubClose" type="button">Закрыть</button>
        </div>
        <div id="subCurrentPlan" style="margin:12px 0"></div>
        <div id="subPlans" class="sub-plans"></div>
        <div id="subPaywall" hidden>
          <div style="background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.3);border-radius:12px;padding:16px;margin:12px 0">
            <div style="font-weight:700;margin-bottom:8px">🔒 Эта функция доступна по подписке</div>
            <div class="muted" id="subPaywallText"></div>
          </div>
        </div>
        <div class="row" style="margin-top:12px">
          <div class="muted" style="text-align:center;font-size:12px">Оплата через ЮKassa • Безопасно • Отмена в любой момент</div>
        </div>
      </div>
    </dialog>

    <dialog id="dlgBooking" class="dialog">
      <div class="dialog-card">
        <div class="dialog-head">
          <div>
            <div class="dialog-title">Запись: <span id="bkVenueTitle"></span></div>
            <div class="muted" id="bkVenueMeta"></div>
          </div>
          <button class="btn ghost" id="btnBookingClose" type="button">Закрыть</button>
        </div>
        <div id="bkBody"></div>
      </div>
    </dialog>

    <a href="./legal-entity.html" style="position:fixed;bottom:1px;right:2px;font-size:5px;color:rgba(0,0,0,0.04);text-decoration:none;z-index:-1;line-height:1" aria-hidden="true" tabindex="-1">.</a>

    <script>
      // Non-module watchdog so we can tell if module JS never starts.
      window.__walkdateStarted = false;
      window.__walkdateModuleLoaded = false;
      window.__walkdateImportAttempted = false;
      window.__walkdateImportOk = false;
      window.__walkdateImportErr = null;

      const renderWalkdateDebug = () => {
        let el = document.getElementById('walkdateDebug');
        if (!el) {
          el = document.createElement('div');
          el.id = 'walkdateDebug';
          el.style.position = 'fixed';
          el.style.left = '12px';
          el.style.right = '12px';
          el.style.top = '12px';
          el.style.zIndex = '99999';
          el.style.padding = '10px 12px';
          el.style.borderRadius = '16px';
          el.style.border = '1px solid rgba(255,255,255,0.14)';
          el.style.background = 'rgba(17,24,39,0.92)';
          el.style.backdropFilter = 'blur(12px)';
          el.style.boxShadow = '0 18px 60px rgba(0,0,0,0.55)';
          el.style.color = '#e5e7eb';
          el.style.font = '600 12px ui-sans-serif, system-ui';
          el.style.whiteSpace = 'pre-wrap';
          el.style.display = 'none';
          document.body.appendChild(el);
        }
        const lines = [
          `WalkDate debug:`,
          `import attempted: ${window.__walkdateImportAttempted}`,
          `import ok: ${window.__walkdateImportOk}`,
          `module loaded: ${window.__walkdateModuleLoaded}`,
          `started: ${window.__walkdateStarted}`
        ];
        if (window.__walkdateImportErr) lines.push(`import err: ${String(window.__walkdateImportErr).slice(0, 220)}`);
        el.textContent = lines.join('\n');
        // Show only if something is wrong.
        el.style.display = window.__walkdateStarted ? 'none' : 'block';
      };

      // Update debug overlay a few times during boot.
      setInterval(renderWalkdateDebug, 500);
      setTimeout(() => {
        if (window.__walkdateStarted) return;
        const el = document.createElement('div');
        el.style.position = 'fixed';
        el.style.left = '12px';
        el.style.right = '12px';
        el.style.top = '12px';
        el.style.zIndex = '99999';
        el.style.padding = '12px 14px';
        el.style.borderRadius = '16px';
        el.style.border = '1px solid rgba(255,255,255,0.14)';
        el.style.background = 'rgba(17,24,39,0.92)';
        el.style.backdropFilter = 'blur(12px)';
        el.style.boxShadow = '0 18px 60px rgba(0,0,0,0.55)';
        el.style.color = '#e5e7eb';
        el.style.font = '600 13px ui-sans-serif, system-ui';
        el.style.whiteSpace = 'pre-wrap';
        el.textContent =
          (window.__walkdateModuleLoaded
            ? 'WalkDate: app.js загрузился, но инициализация зависла (скорее всего storage/IndexedDB).\\n'
            : 'WalkDate: JS не стартовал (app.js не выполнился).\\n') +
          'Откройте DevTools -> Console и Network и пришлите: status app.js и первую ошибку (не Vytal).\\n' +
          'Также попробуйте Incognito (Cmd+Shift+N) и отключите расширения (Vytal мешает консолью).';
        document.body.appendChild(el);
      }, 1500);
    </script>

    <script type="module">
      const showBootError = (err) => {
        window.__walkdateImportErr = err?.message || err;
        const el = document.createElement('div');
        el.style.position = 'fixed';
        el.style.left = '12px';
        el.style.right = '12px';
        el.style.top = '12px';
        el.style.zIndex = '99999';
        el.style.padding = '12px 14px';
        el.style.borderRadius = '16px';
        el.style.border = '1px solid rgba(255,255,255,0.14)';
        el.style.background = 'rgba(17,24,39,0.92)';
        el.style.backdropFilter = 'blur(12px)';
        el.style.boxShadow = '0 18px 60px rgba(0,0,0,0.55)';
        el.style.color = '#e5e7eb';
        el.style.font = '600 13px ui-sans-serif, system-ui';
        el.style.whiteSpace = 'pre-wrap';
        const details = String(err?.stack || err?.message || err).slice(0, 1200);
        el.textContent = `Не удалось загрузить app.js\\n${details}`;
        document.body.appendChild(el);
      };

      window.__walkdateImportAttempted = true;
      // Cache-bust to avoid stale SW cached JS after rapid iterations.
      import('./app.js?v=92')
        .then(() => {
          window.__walkdateImportOk = true;
        })
        .catch(showBootError);
    </script>
  </body>
</html>

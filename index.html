<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="interactive-widget" content="resizes-content" />
    <meta name="theme-color" content="#f4f5fa" />
    <title>WalkDate</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body>
    <div id="app" class="app">
      <nav class="tabs" aria-label="Разделы">
        <button class="tab" data-tab="home" type="button" aria-label="Сообщения">
          <span class="tab-ico" aria-hidden="true">💬</span>
        </button>
        <button class="tab" data-tab="events" type="button" aria-label="События">
          <span class="tab-ico" aria-hidden="true">📅</span>
        </button>
        <button class="tab" data-tab="dating" type="button" aria-label="Знакомства">
          <span class="tab-ico" aria-hidden="true">💞</span>
        </button>
        <button class="tab active" data-tab="stats" type="button" aria-label="Профиль">
          <span class="tab-ico" aria-hidden="true">👤</span>
        </button>
        <button class="tab" data-tab="circle" type="button" aria-label="Круг знакомств">
          <span class="tab-ico" aria-hidden="true">🌐</span>
        </button>
      </nav>

      <main class="main">
        <section class="view hidden" id="view-home"></section>
        <section class="view hidden" id="view-events"></section>
        <section class="view hidden" id="view-dating"></section>
        <section class="view" id="view-stats"></section>
        <section class="view hidden" id="view-circle"></section>
      </main>
    </div>

    <dialog id="dlgQuestionnaire" class="dialog">
      <div class="dialog-card questionnaire-dialog">
        <div class="dialog-head">
          <div>
            <div class="dialog-title">Анкета совместимости</div>
            <div class="muted" id="qnBlock"></div>
          </div>
          <button class="btn ghost" id="btnQuestionnaireClose" type="button">Закрыть</button>
        </div>
        <div class="qn-progress" aria-hidden="true"><div id="qnProgressBar" class="qn-progress-bar"></div></div>
        <div class="qn-counter muted" id="qnCounter"></div>
        <div class="qn-stage">
          <div id="qnCard" class="qn-card"></div>
        </div>
        <div class="row-inline qn-actions">
          <button class="btn ghost" id="btnQuestionnairePrev" type="button">← Назад</button>
          <span class="muted qn-hint">Свайп для навигации</span>
          <button class="btn" id="btnQuestionnaireSkip" type="button">Пропустить</button>
        </div>
      </div>
    </dialog>

    <dialog id="dlgBooking" class="dialog">
      <div class="dialog-card">
        <div class="dialog-head">
          <div>
            <div class="dialog-title">Запись: <span id="bkVenueTitle"></span></div>
            <div class="muted" id="bkVenueMeta"></div>
          </div>
          <button class="btn ghost" id="btnBookingClose" type="button">Закрыть</button>
        </div>
        <div id="bkBody"></div>
      </div>
    </dialog>

    <script>
      // Non-module watchdog so we can tell if module JS never starts.
      window.__walkdateStarted = false;
      window.__walkdateModuleLoaded = false;
      window.__walkdateImportAttempted = false;
      window.__walkdateImportOk = false;
      window.__walkdateImportErr = null;

      const renderWalkdateDebug = () => {
        let el = document.getElementById('walkdateDebug');
        if (!el) {
          el = document.createElement('div');
          el.id = 'walkdateDebug';
          el.style.position = 'fixed';
          el.style.left = '12px';
          el.style.right = '12px';
          el.style.top = '12px';
          el.style.zIndex = '99999';
          el.style.padding = '10px 12px';
          el.style.borderRadius = '16px';
          el.style.border = '1px solid rgba(255,255,255,0.14)';
          el.style.background = 'rgba(17,24,39,0.92)';
          el.style.backdropFilter = 'blur(12px)';
          el.style.boxShadow = '0 18px 60px rgba(0,0,0,0.55)';
          el.style.color = '#e5e7eb';
          el.style.font = '600 12px ui-sans-serif, system-ui';
          el.style.whiteSpace = 'pre-wrap';
          el.style.display = 'none';
          document.body.appendChild(el);
        }
        const lines = [
          `WalkDate debug:`,
          `import attempted: ${window.__walkdateImportAttempted}`,
          `import ok: ${window.__walkdateImportOk}`,
          `module loaded: ${window.__walkdateModuleLoaded}`,
          `started: ${window.__walkdateStarted}`
        ];
        if (window.__walkdateImportErr) lines.push(`import err: ${String(window.__walkdateImportErr).slice(0, 220)}`);
        el.textContent = lines.join('\n');
        // Show only if something is wrong.
        el.style.display = window.__walkdateStarted ? 'none' : 'block';
      };

      // Update debug overlay a few times during boot.
      setInterval(renderWalkdateDebug, 500);
      setTimeout(() => {
        if (window.__walkdateStarted) return;
        const el = document.createElement('div');
        el.style.position = 'fixed';
        el.style.left = '12px';
        el.style.right = '12px';
        el.style.top = '12px';
        el.style.zIndex = '99999';
        el.style.padding = '12px 14px';
        el.style.borderRadius = '16px';
        el.style.border = '1px solid rgba(255,255,255,0.14)';
        el.style.background = 'rgba(17,24,39,0.92)';
        el.style.backdropFilter = 'blur(12px)';
        el.style.boxShadow = '0 18px 60px rgba(0,0,0,0.55)';
        el.style.color = '#e5e7eb';
        el.style.font = '600 13px ui-sans-serif, system-ui';
        el.style.whiteSpace = 'pre-wrap';
        el.textContent =
          (window.__walkdateModuleLoaded
            ? 'WalkDate: app.js загрузился, но инициализация зависла (скорее всего storage/IndexedDB).\\n'
            : 'WalkDate: JS не стартовал (app.js не выполнился).\\n') +
          'Откройте DevTools -> Console и Network и пришлите: status app.js и первую ошибку (не Vytal).\\n' +
          'Также попробуйте Incognito (Cmd+Shift+N) и отключите расширения (Vytal мешает консолью).';
        document.body.appendChild(el);
      }, 1500);
    </script>

    <script type="module">
      const showBootError = (err) => {
        window.__walkdateImportErr = err?.message || err;
        const el = document.createElement('div');
        el.style.position = 'fixed';
        el.style.left = '12px';
        el.style.right = '12px';
        el.style.top = '12px';
        el.style.zIndex = '99999';
        el.style.padding = '12px 14px';
        el.style.borderRadius = '16px';
        el.style.border = '1px solid rgba(255,255,255,0.14)';
        el.style.background = 'rgba(17,24,39,0.92)';
        el.style.backdropFilter = 'blur(12px)';
        el.style.boxShadow = '0 18px 60px rgba(0,0,0,0.55)';
        el.style.color = '#e5e7eb';
        el.style.font = '600 13px ui-sans-serif, system-ui';
        el.style.whiteSpace = 'pre-wrap';
        const details = String(err?.stack || err?.message || err).slice(0, 1200);
        el.textContent = `Не удалось загрузить app.js\\n${details}`;
        document.body.appendChild(el);
      };

      window.__walkdateImportAttempted = true;
      // Cache-bust to avoid stale SW cached JS after rapid iterations.
      import('./app.js?v=65')
        .then(() => {
          window.__walkdateImportOk = true;
        })
        .catch(showBootError);
    </script>
  </body>
</html>
